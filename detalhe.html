<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Produto | Elétrica Total</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./css/style.css">

    <!-- Ícones -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">

    <!-- JS da página de detalhes -->
    <script src="./js/produtos.js" defer></script>
</head>

<body>

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header>

        <a href="index.html" class="logo">
            <img src="./img/logo_eletrica.png" alt="Elétrica Total">
        </a>

    </header>


    <!-- =====================================================
         CONTEÚDO PRINCIPAL
    ====================================================== -->

    <main>

        <!-- Botão voltar -->

        <a href="index.html" class="voltar">
            <i class="ph ph-arrow-left"></i>
            Voltar ao catálogo
        </a>


        <!-- =================================================
             DETALHE DO PRODUTO
        ================================================== -->

        <section id="produto">

            <!--
                O JavaScript vai colocar
                o produto aqui
            -->

        </section>


        <!-- =================================================
             PRODUTOS RELACIONADOS
        ================================================== -->

        <section class="relacionados">

            <div class="titulo-relacionados">

                <span>VOCÊ TAMBÉM PODE GOSTAR</span>

                <h2>
                    Produtos relacionados
                </h2>

            </div>


            <div id="relacionados">

                <!--
                    Os produtos relacionados
                    serão inseridos pelo JavaScript
                -->

            </div>

        </section>

    </main>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer>

        <div class="footer-logo">

            <img src="./img/logo_eletrica.png" alt="Elétrica Total">

        </div>


        <div class="footer-beneficios">

            <div class="beneficio">

                <i class="ph ph-truck"></i>

                <div>
                    <strong>Entrega rápida</strong>
                    <span>Para todo o Brasil</span>
                </div>

            </div>


            <div class="beneficio">

                <i class="ph ph-shield-check"></i>

                <div>
                    <strong>Compra segura</strong>
                    <span>Seus dados protegidos</span>
                </div>

            </div>


            <div class="beneficio">

                <i class="ph ph-headset"></i>

                <div>
                    <strong>Atendimento</strong>
                    <span>Especializado</span>
                </div>

            </div>

        </div>


        <div class="footer-info">

            <div class="footer-links">

                <a href="#">
                    Termos de Uso
                </a>

                <span>|</span>

                <a href="#">
                    Política de Privacidade
                </a>

            </div>

            <p>
                © 2026 Elétrica Total.
                Todos os direitos reservados.
            </p>

        </div>

    </footer>

</body>

</html>
